name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      - name: Auto-optimize Hero Video (if uploaded from phone)
        run: |
          if [ -f "public/hero-video.mp4" ]; then
            FILESIZE=$(stat -c%s "public/hero-video.mp4" 2>/dev/null || stat -f%z "public/hero-video.mp4" 2>/dev/null || echo 0)
            if [ "$FILESIZE" -gt 3000000 ]; then
              echo "Optimizing large video ($FILESIZE bytes)..."
              ffmpeg -y -i public/hero-video.mp4 -vf "scale='min(1280,iw)':-2" -c:v libx264 -crf 23 -preset fast -an -movflags +faststart public/hero-video-opt.mp4
              mv public/hero-video-opt.mp4 public/hero-video.mp4
              ffmpeg -y -ss 00:00:01.5 -i public/hero-video.mp4 -vframes 1 -q:v 2 public/hero-poster.jpg || true
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
